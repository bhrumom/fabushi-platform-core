[package]
name = "codex-login"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["full"]
# Full upstream-compatible login stack. Mahayana product code that only needs
# JWT expiry parsing disables default features so it does not pull Codex
# config/protocol/network-proxy into the native product graph.
full = [
    "dep:codex-agent-identity",
    "dep:codex-http-client",
    "dep:codex-config",
    "dep:codex-keyring-store",
    "dep:codex-model-provider-info",
    "dep:codex-otel",
    "dep:codex-protocol",
    "dep:codex-secrets",
    "dep:codex-terminal-detection",
    "dep:codex-utils-template",
    "dep:http",
    "dep:once_cell",
    "dep:os_info",
    "dep:rand",
    "dep:reqwest",
    "dep:sha2",
    "dep:tiny_http",
    "dep:tokio",
    "dep:tracing",
    "dep:url",
    "dep:urlencoding",
    "dep:webbrowser",
]

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
codex-agent-identity = { workspace = true, optional = true }
codex-http-client = { workspace = true, optional = true }
codex-config = { workspace = true, optional = true }
codex-keyring-store = { workspace = true, optional = true }
codex-model-provider-info = { workspace = true, optional = true }
codex-otel = { workspace = true, optional = true }
codex-protocol = { workspace = true, optional = true }
codex-secrets = { workspace = true, optional = true }
codex-terminal-detection = { workspace = true, optional = true }
codex-utils-template = { workspace = true, optional = true }
http = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
os_info = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "blocking"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true }
tiny_http = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }
webbrowser = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
core_test_support = { workspace = true }
jsonwebtoken = { workspace = true }
keyring = { workspace = true }
pretty_assertions = { workspace = true }
regex-lite = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }

[lib]
doctest = false
