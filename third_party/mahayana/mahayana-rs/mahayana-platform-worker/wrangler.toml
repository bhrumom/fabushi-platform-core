name = "mahayana-platform"
main = "build/worker/shim.mjs"
compatibility_date = "2026-07-18"
# Marketplace plugins are independent public Workers/Pages deployments. The
# platform resolves their public URLs instead of requiring per-plugin bindings.
compatibility_flags = ["global_fetch_strictly_public"]

[build]
command = "worker-build --release --no-panic-recovery"

[vars]
ACCESS_TOKEN_KEY_ID = "mahayana-account-2026-07"
PLUGIN_TOKEN_KEY_ID = "mahayana-account-2026-07"
DEFAULT_AI_TOKEN_LIMIT = "2000000"
# api.ombhrum.com is the stable public account/control-plane origin. During the
# no-downtime migration the legacy Worker forwards canonical platform paths to
# this Worker; OAuth callbacks and browser handoff therefore already use the
# final public origin before the custom-domain ownership is switched.
AUTH_PUBLIC_BASE_URL = "https://api.ombhrum.com"

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "mahayana-platform"
database_id = "24e53e28-5abd-4850-ae99-cd5d2bdfffb0"
migrations_dir = "migrations"

# Account rollout remains physically separate from platform collaboration and
# commerce so each database keeps an independent migration/rollback window.
[[d1_databases]]
binding = "ACCOUNT_DB"
database_name = "fabushi-db"
database_id = "7b6318f0-fbc2-42f9-9887-85f878ae76d0"
migrations_dir = "account-migrations"

[[queues.producers]]
binding = "PLATFORM_EVENTS"
queue = "mahayana-platform-events"
