# Audited compatibility family: embedded Codex lock on 2026-08-22.
# rama-core 0.3.0-alpha.4 declares semver ranges for sibling pre-release crates.
# Cargo can otherwise resolve stable 0.3.0 siblings, whose APIs are incompatible
# with alpha.4. Pin every sibling that drifted in CI to the exact audited Codex
# lock versions at this explicit compatibility boundary. Mahayana-native crates
# remain Rama-free.
rama-error = "=0.3.0-alpha.4"
rama-macros = "=0.3.0-alpha.4"
rama-utils = "=0.3.0-alpha.4"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true

# musl targets do not provide a system OpenSSL installation. Keep the vendored
# fallback only there; Android/iOS use Rustls throughout the embedded graph.
[target.'cfg(target_env = "musl")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }
