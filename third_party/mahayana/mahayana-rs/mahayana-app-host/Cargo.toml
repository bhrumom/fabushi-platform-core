[package]
name = "mahayana-app-host"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[lib]
crate-type = ["rlib"]

[dependencies]
mahayana-core.workspace = true
mahayana-host-protocol.workspace = true
mahayana-js-runtime.workspace = true
mahayana-plugin-runtime.workspace = true
mahayana-product.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
mahayana-feature-host = { workspace = true, features = ["mobile-embedded"] }
mahayana-host = { workspace = true, features = ["mobile-embedded"] }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
mahayana-feature-host = { workspace = true, features = ["desktop-full"] }
mahayana-host = { workspace = true, features = ["desktop-full"] }
