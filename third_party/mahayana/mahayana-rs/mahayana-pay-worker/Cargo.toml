[package]
name = "mahayana-pay-worker"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Standalone Fabushi Pay Cloudflare Worker over the shared Mahayana D1 ledger."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# worker-rs/uuid uses getrandom 0.3 while the current crypto stack still
# contains getrandom 0.2. Both need an explicit browser/Worker entropy source
# on wasm32-unknown-unknown; the alias activates the 0.2 feature transitively.
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto", "use_pem"] }
uuid = { version = "1", features = ["js", "v4"] }
wasm-bindgen = "=0.2.126"
worker = { path = "worker-compat" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
# wasm-bindgen requires the externref table in release Wasm output; stripping
# symbols removes it. Keep debug info stripped while preserving Wasm metadata.
strip = "debuginfo"

# Cloudflare's build image does not need the optional wasm-opt download for
# this worker. Keeping the bindgen output unoptimized also avoids making a
# production deploy depend on an external binary mirror.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# This service is intentionally its own small workspace so payment CI/deploys
# do not resolve or build the much larger Mahayana/Codex desktop graph.
[workspace]
