name = "fabushi-pay"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-21"
workers_dev = true

[build]
command = "cargo install -q --locked 'worker-build@^0.8' && worker-build --release"

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "mahayana-platform"
database_id = "24e53e28-5abd-4850-ae99-cd5d2bdfffb0"
migrations_dir = "../mahayana-platform-worker/migrations"

[observability]
enabled = true

[env.production]
name = "fabushi-pay-prod"
workers_dev = false
routes = [
  { pattern = "pay.ombhrum.com", custom_domain = true }
]

[env.production.vars]
APPLE_BUNDLE_ID = "com.ombhrum.fabushi"
GOOGLE_PLAY_PACKAGE_NAME = "com.ombhrum.fabushi"

[[env.production.d1_databases]]
binding = "PLATFORM_DB"
database_name = "mahayana-platform"
database_id = "24e53e28-5abd-4850-ae99-cd5d2bdfffb0"
migrations_dir = "../mahayana-platform-worker/migrations"
