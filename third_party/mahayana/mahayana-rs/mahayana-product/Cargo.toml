[package]
name = "mahayana-platform-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
# Transitional source aliases keep the large product client diff narrow while
# the actual packages are Mahayana-owned. The source-boundary gate verifies
# these aliases never point back at upstream vendor crates.
codex-login = { package = "mahayana-auth", path = "../mahayana-auth" }
codex-secrets = { package = "mahayana-secrets", path = "../mahayana-secrets" }
mahayana-platform-core.workspace = true
mahayana-host-protocol.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url.workspace = true
