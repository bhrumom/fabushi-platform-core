[workspace]
members = [
  "crates/global-dharma-core",
  "crates/global-dharma-daemon",
  "crates/global-dharmactl",
  "crates/global-dharma-mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
url = { version = "2", features = ["serde"] }
ureq = { version = "2", features = ["json"] }
