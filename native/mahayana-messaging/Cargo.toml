[package]
name = "fabushi-messaging-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Self-hosted, platform-neutral Rust messaging domain for Fabushi humans, AI agents, bots, payments, and Mini Apps."
publish = false

[lib]
name = "fabushi_messaging_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.2"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
