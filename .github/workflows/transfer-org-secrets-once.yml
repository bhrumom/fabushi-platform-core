name: Transfer organization secrets once
on: workflow_dispatch
permissions:
  contents: read
jobs:
  encrypt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install encryption library
        run: python3 -m pip install --quiet PyNaCl==1.6.2
      - name: Encrypt for destination organization
        env:
          SRC_ACCESS_TOKEN_PUBLIC_KEY_PEM: ${{ secrets.ACCESS_TOKEN_PUBLIC_KEY_PEM }}
          SRC_ALIPAY_PRIVATE_KEY: ${{ secrets.ALIPAY_PRIVATE_KEY }}
          SRC_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SRC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SRC_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SRC_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SRC_APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          SRC_APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          SRC_APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          SRC_APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          SRC_APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          SRC_APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          SRC_AUTH_SYSTEM_MAIL_TOKEN: ${{ secrets.AUTH_SYSTEM_MAIL_TOKEN }}
          SRC_AUTH_SYSTEM_MAIL_URL: ${{ secrets.AUTH_SYSTEM_MAIL_URL }}
          SRC_CHATGPT_ANDROID_APK_SHA256: ${{ secrets.CHATGPT_ANDROID_APK_SHA256 }}
          SRC_CHATGPT_ANDROID_APK_URL: ${{ secrets.CHATGPT_ANDROID_APK_URL }}
          SRC_CHATGPT_ANDROID_PROBE_URL: ${{ secrets.CHATGPT_ANDROID_PROBE_URL }}
          SRC_CHATGPT_AUTO_CONFIRM_STATE_KEY: ${{ secrets.CHATGPT_AUTO_CONFIRM_STATE_KEY }}
          SRC_CHATGPT_CODEX_AUTH_B64: ${{ secrets.CHATGPT_CODEX_AUTH_B64 }}
          SRC_CHATGPT_SESSION_COOKIES_B64: ${{ secrets.CHATGPT_SESSION_COOKIES_B64 }}
          SRC_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SRC_FABUSHI_CI_TEST_PASSWORD: ${{ secrets.FABUSHI_CI_TEST_PASSWORD }}
          SRC_FABUSHI_CI_TEST_USERNAME: ${{ secrets.FABUSHI_CI_TEST_USERNAME }}
          SRC_FABUSHI_PAY_ADMIN_TOKEN: ${{ secrets.FABUSHI_PAY_ADMIN_TOKEN }}
          SRC_FABUSHI_PAY_WEBHOOK_SECRET: ${{ secrets.FABUSHI_PAY_WEBHOOK_SECRET }}
          SRC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SRC_GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          SRC_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SRC_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          SRC_IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          SRC_IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          SRC_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          SRC_IOS_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          SRC_MACOS_APP_STORE_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_APP_STORE_CERTIFICATE_P12_BASE64 }}
          SRC_MACOS_APP_STORE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_STORE_CERTIFICATE_PASSWORD }}
          SRC_MACOS_APP_STORE_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_APP_STORE_INSTALLER_CERTIFICATE_P12_BASE64 }}
          SRC_MACOS_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD }}
          SRC_MACOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          SRC_MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          SRC_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SRC_MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          SRC_OFFICIAL_SITE_RELEASE_PAT: ${{ secrets.OFFICIAL_SITE_RELEASE_PAT }}
          SRC_STAGING_TEST_LOGIN: ${{ secrets.STAGING_TEST_LOGIN }}
          SRC_STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          SRC_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SRC_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SRC_TEST_ACCOUNT_TOKEN: ${{ secrets.TEST_ACCOUNT_TOKEN }}
          SRC_VERSION_POLICY_AUTOMATION_TOKEN: ${{ secrets.VERSION_POLICY_AUTOMATION_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import os,json,base64
          from nacl.public import PublicKey,SealedBox
          names=['ACCESS_TOKEN_PUBLIC_KEY_PEM', 'ALIPAY_PRIVATE_KEY', 'ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD', 'APPLE_ISSUER_ID', 'APPLE_KEY_ID', 'APPLE_PRIVATE_KEY', 'APP_STORE_CONNECT_API_ISSUER_ID', 'APP_STORE_CONNECT_API_KEY_BASE64', 'APP_STORE_CONNECT_API_KEY_ID', 'AUTH_SYSTEM_MAIL_TOKEN', 'AUTH_SYSTEM_MAIL_URL', 'CHATGPT_ANDROID_APK_SHA256', 'CHATGPT_ANDROID_APK_URL', 'CHATGPT_ANDROID_PROBE_URL', 'CHATGPT_AUTO_CONFIRM_STATE_KEY', 'CHATGPT_CODEX_AUTH_B64', 'CHATGPT_SESSION_COOKIES_B64', 'CLOUDFLARE_API_TOKEN', 'FABUSHI_CI_TEST_PASSWORD', 'FABUSHI_CI_TEST_USERNAME', 'FABUSHI_PAY_ADMIN_TOKEN', 'FABUSHI_PAY_WEBHOOK_SECRET', 'FIREBASE_PROJECT_ID', 'GCP_SERVICE_ACCOUNT', 'GCP_WORKLOAD_IDENTITY_PROVIDER', 'GOOGLE_PLAY_SERVICE_ACCOUNT_JSON', 'IOS_CERTIFICATE_P12_BASE64', 'IOS_CERTIFICATE_PASSWORD', 'IOS_PROVISIONING_PROFILE_BASE64', 'IOS_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64', 'MACOS_APP_STORE_CERTIFICATE_P12_BASE64', 'MACOS_APP_STORE_CERTIFICATE_PASSWORD', 'MACOS_APP_STORE_INSTALLER_CERTIFICATE_P12_BASE64', 'MACOS_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD', 'MACOS_APP_STORE_PROVISIONING_PROFILE_BASE64', 'MACOS_CERTIFICATE_P12_BASE64', 'MACOS_CERTIFICATE_PASSWORD', 'MACOS_CODESIGN_IDENTITY', 'OFFICIAL_SITE_RELEASE_PAT', 'STAGING_TEST_LOGIN', 'STAGING_TEST_PASSWORD', 'STRIPE_SECRET_KEY', 'STRIPE_WEBHOOK_SECRET', 'TEST_ACCOUNT_TOKEN', 'VERSION_POLICY_AUTOMATION_TOKEN']
          box=SealedBox(PublicKey(base64.b64decode('203rfGYja5N06wPtEP+hZMY5bVO8+VuYHXJyW8YSf0Q=')))
          missing=[n for n in names if not os.environ.get('SRC_'+n)]
          if missing: raise SystemExit('Missing source secret names: '+', '.join(missing))
          payload=[{'name':n,'encrypted_value':base64.b64encode(box.encrypt(os.environ['SRC_'+n].encode())).decode(),'key_id':'3380204578043523366','visibility':'selected','selected_repository_ids':[1375312939]} for n in names]
          with open('encrypted-secrets.json','w') as f: json.dump(payload,f)
          print('Encrypted secret count:',len(payload))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: destination-encrypted-secrets
          path: encrypted-secrets.json
          retention-days: 1
