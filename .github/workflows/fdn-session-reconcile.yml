name: FDN Remote Computer Session Reconcile

on:
  pull_request:
    paths:
      - "docs/specs/fdn-001-remote-computer-session-reconciliation.md"
      - "third_party/mahayana/mahayana-rs/mahayana-platform-worker/**"
      - "deploy/platform-worker/**"
      - ".github/workflows/fdn-session-reconcile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --manifest-path deploy/platform-worker/Cargo.toml -- --check
      - name: Host schema and contract tests
        run: cargo test --manifest-path deploy/platform-worker/Cargo.toml
      - name: Wasm worker check
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --manifest-path deploy/platform-worker/Cargo.toml --target wasm32-unknown-unknown
