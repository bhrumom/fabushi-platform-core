name: Official MCP OAuth broker
on:
  pull_request:
    paths: ['third_party/mahayana/mahayana-rs/mahayana-platform-worker/**', 'third_party/mahayana/mahayana-rs/Cargo.lock', '.github/workflows/official-mcp-oauth.yml', 'scripts/test-mcp-oauth-migration.py', 'deploy/platform-worker/**']
  push:
    branches: [main, work/official-mcp-oauth-20261009]
    paths: ['third_party/mahayana/mahayana-rs/mahayana-platform-worker/**', 'third_party/mahayana/mahayana-rs/Cargo.lock', '.github/workflows/official-mcp-oauth.yml', 'scripts/test-mcp-oauth-migration.py', 'deploy/platform-worker/**']
permissions:
  contents: read
jobs:
  broker:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: deploy/platform-worker -> target
      - name: Test connection policy and authenticated credential delivery
        run: cargo test --locked --manifest-path deploy/platform-worker/Cargo.toml -p mahayana-platform-worker
      - name: Compile actual Cloudflare Worker and broker routes
        run: cargo check --locked --manifest-path deploy/platform-worker/Cargo.toml --target wasm32-unknown-unknown -p mahayana-platform-worker
      - name: Verify additive connection migration and attempt lifecycle
        run: python3 scripts/test-mcp-oauth-migration.py
      - name: Record exact source and verification scope
        run: |
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          echo 'Cryptography, SQLite and wasm compile evidence. Real Google/GitHub and packaged-product acceptance remain separate.' >> "$GITHUB_STEP_SUMMARY"
