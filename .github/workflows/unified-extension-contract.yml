name: Unified Extension Contract

on:
  push:
    branches:
      - "work/fpm-extension-contract-20261011"
      - "work/fpm-extension-trust-contract-20261011"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extension-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Reconcile checked-in crate lockfile on implementation branch
        if: github.event_name == 'push'
        run: |
          cargo generate-lockfile --manifest-path native/mahayana-messaging/Cargo.toml
          if ! git diff --quiet -- native/mahayana-messaging/Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add native/mahayana-messaging/Cargo.lock
            git commit -m "chore(lock): refresh messaging contract dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Test shared contract crate from locked dependencies
        run: cargo test --locked --manifest-path native/mahayana-messaging/Cargo.toml
      - name: Compile shared contract crate from locked dependencies
        run: cargo check --locked --manifest-path native/mahayana-messaging/Cargo.toml
      - name: Record exact tested source
        run: git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
