name: Unified Extension Contract

on:
  push:
    branches:
      - "work/fpm-extension-contract-20261011"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Test shared contract crate
        run: cargo test --locked --manifest-path native/mahayana-messaging/Cargo.toml
      - name: Compile shared contract crate
        run: cargo check --locked --manifest-path native/mahayana-messaging/Cargo.toml
      - name: Record exact source
        run: git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
