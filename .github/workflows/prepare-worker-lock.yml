name: Prepare isolated Worker dependency lock
on:
  push:
    branches: [work/official-mcp-oauth-20261009]
    paths: ['.github/workflows/prepare-worker-lock.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Resolve canonical isolated Worker lock in Actions
        run: cargo metadata --manifest-path deploy/platform-worker/Cargo.toml --format-version 1 > /dev/null
      - name: Expose generated dependency metadata for commit readback
        run: python3 -c "import pathlib,base64; print('CARGO_LOCK_BASE64:'+base64.b64encode(pathlib.Path('deploy/platform-worker/Cargo.lock').read_bytes()).decode())"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-worker-lock-${{ github.sha }}
          path: deploy/platform-worker/Cargo.lock
          if-no-files-found: error
      - name: State preparation scope
        run: echo 'Lock preparation only. Commit artifact and pass exact-head --locked verification before acceptance.' >> "$GITHUB_STEP_SUMMARY"
